<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partner baggage policy &mdash; MockJet</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <span class="brand-mark">A</span>
        <span><span class="brand-name">MockJet</span></span>
      </a>
    </header>
    <main class="page-wrap">
      <h1 data-testid="partner-baggage-heading">
        Alliance partner baggage policy
      </h1>
      <div class="panel">
        <p>
          This page opens in a new tab so you can compare it against your
          MockJet fare while keeping your search results open.
        </p>
        <table
          style="width: 100%; border-collapse: collapse"
          data-testid="partner-baggage-table"
        >
          <thead>
            <tr style="text-align: left; border-bottom: 1px solid var(--line)">
              <th style="padding: 8px 0">Cabin</th>
              <th style="padding: 8px 0">Carry-on</th>
              <th style="padding: 8px 0">Checked bags</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-bottom: 1px solid var(--line)">
              <td style="padding: 8px 0">Economy</td>
              <td>1</td>
              <td>0</td>
            </tr>
            <tr style="border-bottom: 1px solid var(--line)">
              <td style="padding: 8px 0">Premium Economy</td>
              <td>1</td>
              <td>1</td>
            </tr>
            <tr>
              <td style="padding: 8px 0">Business</td>
              <td>2</td>
              <td>2</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
